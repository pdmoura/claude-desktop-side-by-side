name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell (PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $errs = $null; $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\claude-profile.ps1", [ref]$tokens, [ref]$errs)
          if ($errs) { $errs | Format-List; exit 1 }
          Write-Output "Parses cleanly on Windows PowerShell $($PSVersionTable.PSVersion)"
      - name: Run PSScriptAnalyzer (errors only)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Force -Scope CurrentUser }
          $results = Invoke-ScriptAnalyzer -Path ./claude-profile.ps1 -Severity Error
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }

  shell:
    name: Shell (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck (errors only)
        run: shellcheck --severity=error claude-profile.sh

  macos-bash:
    name: macOS bash 3.2 syntax
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check with the system bash (3.2)
        run: |
          /bin/bash --version | head -n 1
          /bin/bash -n claude-profile.sh
