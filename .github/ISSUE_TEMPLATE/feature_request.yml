name: Feature request
description: Suggest an improvement to the scripts or docs
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Windows
        - macOS
    validations:
      required: true
  - type: checkboxes
    id: willing
    attributes:
      label: Contributing
      options:
        - label: I'd be willing to open a pull request for this
